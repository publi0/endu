# Fork: merge anomalyco/hex main into this fork daily and release the result.
# A conflict, or an upstream change to workflow files (which the Actions token
# may not push), stops here; resolve it locally as described in FORK.md.
name: Fork upstream sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/anomalyco/hex.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream conflicts with the fork. Merge upstream/main locally (see FORK.md)."
            exit 1
          fi
          if [ -n "$(git diff --name-only ORIG_HEAD HEAD -- .github/workflows)" ]; then
            echo "::error::Upstream changed workflow files, which the Actions token cannot push. Use GitHub's 'Sync fork' button or merge locally."
            exit 1
          fi
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  release:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/fork-release.yml

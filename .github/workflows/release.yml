name: Release

# A release is a version change in Cargo.toml. Code-only pushes never start a
# run; use workflow_dispatch to finish an interrupted release or repair the cask.
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hex-release
  cancel-in-progress: false

jobs:
  # Decide on Linux in seconds, so non-release Cargo.toml edits never wait for
  # a macOS runner and never queue ahead of a real release.
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select the Cargo version
        id: plan
        run: python3 scripts/release.py plan
      - name: Decide whether a macOS release run is needed
        id: decide
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          BUILD: ${{ steps.plan.outputs.build }}
          SKIP: ${{ steps.plan.outputs.skip }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$SKIP" = "true" ]; then
            needed=false
          elif [ "$EVENT" = "workflow_dispatch" ] || [ "$BUILD" = "true" ]; then
            needed=true
          elif grep -qx "  version \"$VERSION\"" Casks/endu.rb 2>/dev/null; then
            # Published and already in the cask: nothing to build or repair.
            needed=false
          else
            needed=true
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "Release run needed for $VERSION: $needed"

  release:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select the Cargo version
        id: plan
        run: python3 scripts/release.py plan
      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.build == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.build == 'true'
        with:
          shared-key: release
          cache-on-failure: true
      - name: Prepare the persistent signing identity
        if: steps.plan.outputs.build == 'true'
        env:
          HEX_SIGNING_P12_BASE64: ${{ secrets.HEX_SIGNING_P12_BASE64 }}
          HEX_SIGNING_P12_PASSWORD: ${{ secrets.HEX_SIGNING_P12_PASSWORD }}
        run: python3 scripts/code_signing.py --check-identity
      - name: Build the app
        if: steps.plan.outputs.build == 'true'
        run: scripts/build-app.sh --prepare
      - name: Sign and package with the persistent identity
        if: steps.plan.outputs.build == 'true'
        env:
          HEX_SIGNING_P12_BASE64: ${{ secrets.HEX_SIGNING_P12_BASE64 }}
          HEX_SIGNING_P12_PASSWORD: ${{ secrets.HEX_SIGNING_P12_PASSWORD }}
        run: python3 scripts/code_signing.py
      - name: Publish and update Homebrew
        if: steps.plan.outputs.skip != 'true'
        run: python3 scripts/release.py publish
